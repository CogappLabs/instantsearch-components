<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>React 18, script tags</title>
    <link rel="stylesheet" href="/cdn/instantsearch-components.css" />
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-instantsearch@7/dist/umd/ReactInstantSearch.min.js"></script>
    <script src="/cdn/react-instantsearch.min.js"></script>
    <script src="/pages/fake-client.js"></script>
  </head>
  <body>
    <div id="toggle"></div>
    <div id="search"></div>
    <script>
      const h = React.createElement;
      ReactDOM.createRoot(document.getElementById("search")).render(
        h(
          ReactInstantSearch.InstantSearch,
          { searchClient: fakeClient, indexName: "demo" },
          h(FacetToggle, { attribute: "hasImage", label: "Has image" }),
          h(DateHistogram, { attribute: "year", labels: { group: "Date" } }),
        ),
      );
    </script>
  </body>
</html>
