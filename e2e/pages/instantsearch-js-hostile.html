<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>InstantSearch.js, with a site's own input styles</title>
    <style>
      /* A site-wide input rule, of the kind that stopped the handles short of the ends. */
      input { padding: 6px 12px; border: 2px solid #999; margin: 4px; max-width: 90%; }
    </style>
    <link rel="stylesheet" href="/cdn/instantsearch-components.css" />
    <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4"></script>
    <script src="/cdn/instantsearch-js.min.js"></script>
    <script src="/pages/fake-client.js"></script>
  </head>
  <body>
    <div id="refinements"></div>
    <div id="starting"></div>
    <div id="toggle"></div>
    <div id="place"></div>
    <div id="search"></div>
    <script>
      const search = instantsearch({ indexName: "demo", searchClient: fakeClient });
      search.addWidgets([
        CogappInstantSearch.startingPoints({
          container: "#starting",
          items: [{ title: "Has an image", text: "Records you can see.", state: { toggle: { hasImage: true } } }],
        }),
        instantsearch.widgets.currentRefinements({
          container: "#refinements",
          transformItems: CogappInstantSearch.readableRefinements({
            headings: { year: "Date" },
            setUiState: (update) => search.setUiState(update),
          }),
        }),
        CogappInstantSearch.facetToggle({ container: "#toggle", attribute: "hasImage", label: "Has image" }),
        CogappInstantSearch.hierarchyList({ container: "#place", attribute: "place" }),
        CogappInstantSearch.dateHistogram({
          container: "#search",
          attribute: "year",
          labels: { group: "Date" },
        }),
      ]);
      search.start();
    </script>
  </body>
</html>
