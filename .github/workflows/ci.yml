name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The peer range starts at React 18; the lockfile installs 19.
    strategy:
      matrix:
        react: [18, 19]
    name: check (React ${{ matrix.react }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.react == 18
        run: npm install --no-save react@18 react-dom@18 @types/react@18
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # cdn/ is committed for jsDelivr, so it must match the source it was built from.
      - if: matrix.react == 19
        run: git diff --exit-code -- cdn && test -z "$(git status --porcelain -- cdn)"
